syntax = "proto3";

enum Status {
    Finalized = 0;
    Processing = 1;
    Failed = 2;
}

message TxResponse {
    Status status = 1;
    uint64 fsid = 2;
    string signature = 3;
    string message = 4;
}

message Metadata {
    string path = 1;
    string parent_path = 2;
    string owner = 3;
    bool is_dir = 4;
    uint32 depth = 5;
    uint64 size = 6;
    uint64 created_at = 7;
}

message Exists {
    bool exists = 1;
}

message DirEntry {
    string path = 1;
    string parent_path = 2;
    string name = 3;
    bool is_dir = 4;
    uint64 size = 5;
    uint64 created_at = 6;
    uint64 modified_at = 7;
}

message ListDir {
    repeated DirEntry entries = 1;
}

// Unified RpcResponse using oneof
message RpcResponse {
    oneof response {
        Metadata metadata = 1;
        Exists exists = 2;
        ListDir list_dir = 3;
    }
}