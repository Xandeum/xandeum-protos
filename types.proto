syntax = "proto3";

enum Opcode {
    BIGBANG = 0;    
    ARMAGEDDON = 1; 
    OPENRW = 2;    
    PEEK = 3;      
    POKE = 4;    
    RM = 5;        
    MKDIR = 6;     
    RMDIR = 7; 
    RENAME = 8;
    COPY = 9;
    MOVE = 13;
    ASSIGN_COOWNER = 14;

    // TODO: Refactor RPC opcodes into a distinct type or oneof block

    LIST_DIRS = 10;
    GET_METADATA = 11;
    EXISTS = 12;
    LIST_DIRS_OWNER =15;
}

message Request{
    Opcode op =1;
    bytes pubkey =2;
    bytes data = 3; // 8 bytes id 
    string signature =4;
}
